name: Verify PWA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:singlefile
      - run: node scripts/verify-singlefile.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-singlefile-browser.mjs
      - run: npm run test:browser
